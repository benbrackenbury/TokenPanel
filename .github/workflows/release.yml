name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build DMG & publish
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Parse version from tag
        id: version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # v1.2.3 -> 1.2.3
          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?([.-].*)?$ ]]; then
            echo "Tag must look like v1.0.0 (got: $TAG)"
            exit 1
          fi
          # Numeric build from git rev count (unique, increasing)
          BUILD="$(git rev-list --count HEAD)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "Using version=$VERSION build=$BUILD"

      - name: Build Release app
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
        run: |
          set -euo pipefail
          xcodebuild \
            -project TokenPanel.xcodeproj \
            -scheme TokenPanel \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= \
            build

          APP_PATH="$(find build/DerivedData/Build/Products/Release -name 'TokenPanel.app' -type d | head -n 1)"
          if [[ -z "$APP_PATH" || ! -d "$APP_PATH" ]]; then
            echo "TokenPanel.app not found under DerivedData"
            find build/DerivedData/Build/Products -maxdepth 3 -type d -print || true
            exit 1
          fi
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          echo "Built: $APP_PATH"
          defaults read "$APP_PATH/Contents/Info" CFBundleShortVersionString || true
          defaults read "$APP_PATH/Contents/Info" CFBundleVersion || true

      - name: Ad-hoc sign app
        run: |
          set -euo pipefail
          codesign --force --deep --sign - "$APP_PATH"
          codesign -dv --verbose=2 "$APP_PATH" 2>&1 || true

      - name: Package DMG
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          bash scripts/package-dmg.sh "$APP_PATH" "$VERSION"
          DMG_PATH="dist/TokenPanel-${VERSION}.dmg"
          test -f "$DMG_PATH"
          ls -lh "$DMG_PATH"
          echo "DMG_PATH=$DMG_PATH" >> "$GITHUB_ENV"
          # checksum for release notes
          shasum -a 256 "$DMG_PATH" | tee dist/TokenPanel-${VERSION}.dmg.sha256
          echo "SHA256_PATH=dist/TokenPanel-${VERSION}.dmg.sha256" >> "$GITHUB_ENV"

      - name: Sign Sparkle appcast
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${SPARKLE_ED_PRIVATE_KEY:-}" ]]; then
            echo "SPARKLE_ED_PRIVATE_KEY secret is missing"
            exit 1
          fi
          SPARKLE_VERSION=2.10.0
          mkdir -p /tmp/sparkle-tools
          curl -sSL "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz" \
            -o /tmp/sparkle-tools/sparkle.tar.xz
          tar -xf /tmp/sparkle-tools/sparkle.tar.xz -C /tmp/sparkle-tools
          mkdir -p build/sparkle-feed
          cp "$DMG_PATH" "build/sparkle-feed/TokenPanel-${VERSION}.dmg"
          echo "$SPARKLE_ED_PRIVATE_KEY" | /tmp/sparkle-tools/bin/generate_appcast \
            --ed-key-file - \
            --download-url-prefix "https://github.com/benbrackenbury/TokenPanel/releases/download/v${VERSION}/" \
            --link "https://github.com/benbrackenbury/TokenPanel/releases" \
            -o dist/appcast.xml \
            build/sparkle-feed
          test -f dist/appcast.xml
          echo "APPCAST_PATH=dist/appcast.xml" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: TokenPanel ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## TokenPanel ${{ steps.version.outputs.version }}

            macOS menu bar app for plan usage on Grok, Cursor, Claude Code, and Codex / ChatGPT.

            It reuses each product's local session. No extra API keys. It does not track developer API prepaid balances.

            ### Install

            Homebrew:

            ```
            brew trust --cask benbrackenbury/tokenpanel/tokenpanel
            brew tap benbrackenbury/tokenpanel https://github.com/benbrackenbury/TokenPanel
            brew install --cask tokenpanel
            ```

            Or download `TokenPanel-${{ steps.version.outputs.version }}.dmg`, open it, and drag **TokenPanel** to **Applications**.
            On first launch: right-click → **Open** if macOS blocks the unsigned build.
            Then sign in to the tools you care about, then open TokenPanel from the menu bar.

            ```
            grok login
            codex login
            claude
            ```

            Cursor: sign in inside the Cursor app.

            ### Notes
            - Ad-hoc signed (not notarized). Gatekeeper may require **Open** from the context menu once.
            - Sessions expire. If numbers stop loading, sign in again in that product, then refresh.
            - Claude Code only works with the claude.ai subscription login, not an API key.
          files: |
            ${{ env.DMG_PATH }}
            ${{ env.SHA256_PATH }}
            ${{ env.APPCAST_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Homebrew cask
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          SHA256="$(awk '{print $1}' "$SHA256_PATH")"
          bash scripts/write-homebrew-cask.sh "$VERSION" "$SHA256"

          git fetch origin "$DEFAULT_BRANCH"
          git worktree add /tmp/tokenpanel-tap "origin/$DEFAULT_BRANCH"
          mkdir -p /tmp/tokenpanel-tap/Casks
          cp Casks/tokenpanel.rb /tmp/tokenpanel-tap/Casks/tokenpanel.rb

          git -C /tmp/tokenpanel-tap config user.name "github-actions[bot]"
          git -C /tmp/tokenpanel-tap config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C /tmp/tokenpanel-tap add Casks/tokenpanel.rb
          if git -C /tmp/tokenpanel-tap diff --cached --quiet; then
            echo "Homebrew cask already at $VERSION"
            exit 0
          fi
          git -C /tmp/tokenpanel-tap commit -m "chore: bump Homebrew cask to ${VERSION}"
          git -C /tmp/tokenpanel-tap push origin "HEAD:$DEFAULT_BRANCH"
